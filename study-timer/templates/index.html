<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 공부 매니저 - 타이머</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f0f23;
    color: #e0e0e0;
    min-height: 100vh;
}
nav {
    background: #16213e;
    padding: 12px 24px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #0f3460;
}
nav .logo { font-size: 1.2rem; font-weight: 700; color: #e94560; }
nav .nav-links a {
    color: #a0a0c0; text-decoration: none; margin-left: 24px;
    font-weight: 500; transition: color 0.2s;
}
nav .nav-links a:hover, nav .nav-links a.active { color: #e94560; }

.datetime-header {
    text-align: center; padding: 16px 16px 4px;
    max-width: 1000px; margin: 0 auto;
}
.datetime-header .date { font-size: 1rem; color: #999; }
.datetime-header .time {
    font-size: 1.8rem; font-weight: 700; color: #e94560;
    font-variant-numeric: tabular-nums;
}
.datetime-header .remaining { font-size: 0.75rem; color: #555; margin-top: 2px; }

.main {
    max-width: 1000px; margin: 0 auto;
    padding: 12px 16px 24px;
    display: grid;
    grid-template-columns: 370px 1fr;
    gap: 16px;
}
@media (max-width: 780px) { .main { grid-template-columns: 1fr; } }

.card {
    background: #16213e; border-radius: 14px;
    padding: 18px; border: 1px solid #1a1a40;
}
.card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
}
.card-header h2 {
    font-size: 0.85rem; color: #a0a0c0;
    text-transform: uppercase; letter-spacing: 1px;
}
.card-header .info {
    font-size: 0.7rem; color: #666;
}

/* ── 과목 리스트 ── */
.plan-list { list-style: none; }
.plan-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; margin-bottom: 4px;
    border-radius: 10px; border: 2px solid transparent;
    cursor: pointer; transition: all 0.15s;
}
.plan-item:hover { background: #1a1a40; }
.plan-item.selected { border-color: #e94560; background: #1e1535; }
.plan-item.dragging { opacity: 0.3; }
.plan-item.drag-over { border-color: #4CAF50; }

.drag-handle {
    cursor: grab; color: #444; font-size: 0.85rem;
    user-select: none; flex-shrink: 0;
}
.drag-handle:active { cursor: grabbing; }
.plan-num {
    font-size: 0.7rem; color: #e94560; font-weight: 700;
    width: 18px; text-align: center; flex-shrink: 0;
}
.plan-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.plan-name {
    flex: 1; font-weight: 500; font-size: 0.95rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.plan-minutes {
    font-size: 0.7rem; color: #888;
    background: #0f0f23; padding: 2px 7px; border-radius: 6px; flex-shrink: 0;
}
.plan-time-range {
    font-size: 0.65rem; color: #666; flex-shrink: 0;
    min-width: 80px; text-align: right;
}
.plan-time-range .end { color: #e94560; font-weight: 600; }
.plan-del {
    background: none; border: none; color: #f44336; cursor: pointer;
    font-size: 0.9rem; opacity: 0; transition: opacity 0.15s;
    flex-shrink: 0; padding: 0 2px;
}
.plan-item:hover .plan-del { opacity: 0.5; }
.plan-del:hover { opacity: 1 !important; }

.plan-item.done, .plan-item.skipped { opacity: 0.6; }
.plan-item.done .plan-name {
    text-decoration: line-through;
    text-decoration-color: #4CAF50;
    text-decoration-thickness: 2px;
    color: #888;
}
.plan-item.skipped .plan-name {
    text-decoration: line-through;
    text-decoration-color: #FFC107;
    text-decoration-thickness: 2px;
    color: #666;
}
.plan-item.done .plan-minutes,
.plan-item.skipped .plan-minutes { color: #555; }
.plan-item.done .plan-time-range,
.plan-item.skipped .plan-time-range { color: #555; }
.plan-done-btn {
    background: none; border: 2px solid #444; border-radius: 50%;
    width: 20px; height: 20px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; padding: 0; font-size: 0.7rem; color: transparent;
}
.plan-done-btn:hover { border-color: #4CAF50; }
.plan-item.done .plan-done-btn {
    border-color: #4CAF50; background: #4CAF50; color: #fff;
}
.plan-item.skipped .plan-done-btn {
    border-color: #FFC107; background: #FFC107; color: #333;
}
.plan-done-label {
    font-size: 0.6rem; font-weight: 600;
    flex-shrink: 0; margin-left: -4px;
}
.plan-done-label.completed { color: #4CAF50; }
.plan-done-label.skipped { color: #FFC107; }

.plan-total {
    text-align: center; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid #1a1a40;
    font-size: 0.75rem; color: #666;
}
.plan-total strong { color: #e94560; }

/* ── 입력 폼 (추가 or 편집) ── */
.input-form {
    margin-top: 12px; padding: 12px;
    background: #0f0f23; border-radius: 10px;
    border: 1px solid #333;
}
.input-form .form-label {
    font-size: 0.7rem; color: #e94560; margin-bottom: 8px;
    font-weight: 600; text-transform: uppercase;
}
.input-form .form-row {
    display: flex; gap: 6px; align-items: center;
}
.input-form input[type="text"] {
    flex: 1; min-width: 70px;
    padding: 8px 10px; border-radius: 8px;
    border: 1px solid #333; background: #16213e; color: #fff;
    font-size: 0.85rem;
}
.input-form input[type="number"] {
    width: 55px; padding: 8px 6px; border-radius: 8px;
    border: 1px solid #333; background: #16213e; color: #fff;
    font-size: 0.85rem; text-align: center;
}
.input-form .unit { font-size: 0.7rem; color: #666; }
.input-form input[type="color"] {
    width: 32px; height: 32px; border: none; border-radius: 6px;
    cursor: pointer; background: none;
}
.input-form .form-btns {
    display: flex; gap: 4px; margin-top: 8px;
}
.input-form button {
    padding: 7px 14px; border-radius: 8px; border: none;
    font-weight: 600; cursor: pointer; font-size: 0.8rem; color: #fff;
}
.input-form .primary-btn { background: #4CAF50; }
.input-form .secondary-btn { background: #555; }
.input-form .danger-btn { background: #f44336; }

.warning-msg {
    font-size: 0.72rem; color: #FFC107; margin-top: 6px;
    line-height: 1.4; padding: 5px 8px;
    background: #2a2200; border-radius: 6px; border: 1px solid #5a4400;
}

/* ── 타이머 ── */
.timer-section { text-align: center; }
.selected-subject {
    font-size: 1.4rem; font-weight: 700; min-height: 1.6em;
}
.timer-schedule { font-size: 0.8rem; color: #888; margin-bottom: 10px; min-height: 1.2em; }
.timer-display {
    font-size: 4.5rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin: 8px 0; letter-spacing: 2px;
}
.timer-progress {
    width: 100%; height: 5px; background: #1a1a40;
    border-radius: 3px; margin-bottom: 10px; overflow: hidden;
}
.timer-progress .bar {
    height: 100%; background: #4CAF50; border-radius: 3px;
    transition: width 1s linear; width: 0%;
}
.timer-progress .bar.over { background: #f44336; }
.timer-sub { font-size: 0.8rem; color: #888; margin-bottom: 16px; min-height: 1.2em; }
.timer-buttons { display: flex; gap: 12px; justify-content: center; }
.btn {
    padding: 12px 32px; border: none; border-radius: 12px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    color: #fff; font-family: inherit;
}
.btn:hover { opacity: 0.85; }
.btn:active { transform: scale(0.97); }
.btn-start { background: #4CAF50; }
.btn-pause { background: #FFC107; color: #333; }
.btn-stop { background: #f44336; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }

.comment-box {
    margin-top: 16px; padding: 12px; border-radius: 10px;
    background: #1a1a40; text-align: left; line-height: 1.5;
    display: none;
}
.comment-box .label { font-size: 0.7rem; color: #e94560; margin-bottom: 4px; }
.comment-box .text { color: #ccc; font-size: 0.82rem; }

/* ── 오늘 기록 ── */
.today-log { margin-top: 16px; }
.today-summary {
    display: flex; gap: 20px; justify-content: center; margin-bottom: 12px;
}
.today-summary .stat { text-align: center; }
.today-summary .stat .val { font-size: 1.2rem; font-weight: 700; color: #e94560; }
.today-summary .stat .lbl { font-size: 0.6rem; color: #888; }
.today-log table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
.today-log th { text-align: left; padding: 5px 8px; color: #555; border-bottom: 1px solid #333; }
.today-log td { padding: 5px 8px; border-bottom: 1px solid #1a1a40; }
.today-log .empty { color: #444; text-align: center; padding: 14px; }
.subj-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; margin-right: 5px; vertical-align: middle;
}

.debug-bar { text-align: center; margin-top: 8px; }
.debug-bar button {
    font-size: 0.65rem; padding: 3px 8px; border-radius: 6px;
    border: 1px solid #333; background: #1a1a40; color: #666; cursor: pointer;
}
.debug-bar button:hover { color: #e94560; border-color: #e94560; }

.desel-btn {
    font-size: 0.65rem; padding: 3px 8px; border-radius: 6px;
    border: 1px solid #e94560; background: none; color: #e94560;
    cursor: pointer; white-space: nowrap;
}
.desel-btn:hover { background: #e94560; color: #fff; }

/* ── 학생 바 ── */
.student-bar {
    background: #16213e; border-bottom: 1px solid #1a1a40;
    padding: 8px 24px; display: flex; align-items: center; gap: 12px;
    font-size: 0.85rem;
}
.student-bar label { color: #94a3b8; white-space: nowrap; }
.student-bar select {
    background: #0f0f23; color: #e0e0e0; border: 1px solid #1a1a40;
    border-radius: 6px; padding: 4px 8px; font-size: 0.85rem;
}
.student-bar .stu-btn {
    background: none; border: 1px solid #3b82f6; color: #3b82f6;
    border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 0.75rem;
}
.student-bar .stu-btn:hover { background: #3b82f6; color: #fff; }
.student-bar .stu-btn.del { border-color: #e94560; color: #e94560; }
.student-bar .stu-btn.del:hover { background: #e94560; color: #fff; }
.student-bar .stu-count { color: #64748b; font-size: 0.75rem; }

/* ── 모니터링 패널 ── */
.monitor-panel { display: none; margin-top: 16px; }
.monitor-panel.active { display: block; }
.monitor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.webcam-box {
    position: relative;
    background: #0a0a1a;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 4/3;
}
#webcamVideo {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: block;
}
#overlayCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
}
.webcam-badge {
    position: absolute;
    top: 8px; left: 8px;
    font-size: 0.65rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    z-index: 2;
    transform: scaleX(-1);
}
.webcam-badge.ok { background: #1b5e20; color: #81c784; }
.webcam-badge.warn { background: #e65100; color: #ffcc80; }
.webcam-badge.away { background: #b71c1c; color: #ef9a9a; }
.motion-meter {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.65rem; color: #666; margin-top: 6px;
}
.motion-track {
    flex: 1; height: 4px; background: #1a1a40; border-radius: 2px; overflow: hidden;
}
.motion-track .fill { height: 100%; background: #4CAF50; border-radius: 2px; transition: width 0.3s; }

.distraction-panel { display: flex; flex-direction: column; }
.distraction-total-box {
    text-align: center; margin-bottom: 8px;
    padding: 8px; background: #0f0f23; border-radius: 8px;
}
.distraction-total-box .big { font-size: 1.5rem; font-weight: 700; color: #f44336; }
.distraction-total-box .lbl { font-size: 0.65rem; color: #888; }

.dist-bar-row {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
}
.dist-bar-label { width: 70px; font-size: 0.7rem; color: #aaa; text-align: right; flex-shrink: 0; }
.dist-bar-track {
    flex: 1; height: 22px; background: #0f0f23;
    border-radius: 5px; overflow: hidden;
}
.dist-bar-fill {
    height: 100%; border-radius: 5px;
    transition: width 0.5s ease;
    display: flex; align-items: center;
    padding-left: 6px;
    font-size: 0.6rem; font-weight: 600; color: #fff;
}
.dist-bar-val { font-size: 0.65rem; color: #888; width: 36px; flex-shrink: 0; }

.tag-buttons {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 8px;
}
.tag-btn {
    padding: 7px 6px; border: 2px solid #333; border-radius: 8px;
    background: #0f0f23; color: #ccc; font-size: 0.72rem;
    font-weight: 600; cursor: pointer; transition: all 0.15s;
    font-family: inherit; text-align: center;
}
.tag-btn:hover { border-color: #e94560; color: #e94560; }
.tag-btn.active { border-color: #f44336; background: #2a1010; color: #f44336; }
.tag-btn .icon { font-size: 1rem; display: block; margin-bottom: 1px; }

.monitor-log {
    margin-top: 8px; max-height: 100px; overflow-y: auto;
    font-size: 0.6rem; color: #666;
}
.monitor-log .entry { padding: 2px 0; border-bottom: 1px solid #1a1a40; }
.monitor-log .entry .t { color: #e94560; margin-right: 4px; }
</style>
</head>
<body>

<nav>
    <div class="logo">AI 공부 매니저</div>
    <div class="nav-links">
        <a href="/" class="active">타이머</a>
        <a href="/dashboard">대시보드</a>
        <a href="/db">DB</a>
    </div>
</nav>

<div class="student-bar">
    <label>학생:</label>
    <select id="studentSelect" onchange="switchStudent()">
        <option value="">-- 선택 --</option>
    </select>
    <button class="stu-btn" onclick="addStudent()">+ 추가</button>
    <button class="stu-btn" onclick="editStudent()">수정</button>
    <button class="stu-btn del" onclick="deleteStudent()">삭제</button>
    <span class="stu-count" id="stuCount"></span>
</div>

<div class="datetime-header">
    <div class="date" id="curDate"></div>
    <div class="time" id="curTime"></div>
    <div class="remaining" id="curRemain"></div>
</div>

<div class="main">
    <!-- 왼쪽: 공부 계획 -->
    <div class="card">
        <div class="card-header">
            <h2>오늘의 공부 계획</h2>
            <div style="display:flex;gap:6px;align-items:center">
                <button class="desel-btn" id="deselBtn" onclick="event.stopPropagation();deselect()" style="display:none">선택 해제</button>
                <span class="info" id="planInfo"></span>
            </div>
        </div>

        <ul class="plan-list" id="planList"></ul>
        <div class="plan-total" id="planTotal"></div>

        <div class="plan-hint" style="text-align:center;font-size:.7rem;color:#555;margin-top:8px">
            과목을 클릭하면 타이머가 시작됩니다. 같은 과목을 여러 번 할 수 있어요.
        </div>
    </div>

    <!-- 오른쪽: 타이머 + 기록 -->
    <div>
        <div class="card timer-section">
            <div class="selected-subject" id="selSubject" style="color:#555">과목을 선택하세요</div>
            <div class="timer-schedule" id="timerSchedule"></div>
            <div class="timer-display" id="timerDisplay">00:00:00</div>
            <div class="timer-progress"><div class="bar" id="progressBar"></div></div>
            <div class="timer-sub" id="timerSub"></div>
            <div class="timer-buttons">
                <button class="btn btn-start" id="startBtn" onclick="startTimer()" disabled>시작</button>
                <button class="btn btn-pause" id="pauseBtn" onclick="pauseTimer()" disabled>일시정지</button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopTimer()" disabled>종료 & 저장</button>
            </div>
            <div class="comment-box" id="commentBox">
                <div class="label">AI 코멘트</div>
                <div class="text" id="commentText"></div>
            </div>
        </div>

        <div class="card today-log" id="todayLogCard">
            <div class="card-header"><h2>오늘의 기록</h2></div>
            <div class="today-summary" id="todaySummary"></div>
            <table>
                <thead><tr><th>과목</th><th>공부 시간</th><th>시작</th><th>종료</th><th>일시정지</th></tr></thead>
                <tbody id="todayBody"></tbody>
            </table>
        </div>

        <!-- 모니터링 패널 (시작 시 today-log 대신 표시) -->
        <div class="card monitor-panel" id="monitorPanel">
            <div class="card-header"><h2>웹캠 모니터링</h2></div>
            <div class="monitor-grid">
                <div>
                    <div class="webcam-box">
                        <video id="webcamVideo" autoplay playsinline muted></video>
                        <canvas id="overlayCanvas"></canvas>
                        <div class="webcam-badge ok" id="webcamBadge">집중 중</div>
                    </div>
                    <div class="motion-meter">
                        <span>움직임</span>
                        <div class="motion-track"><div class="fill" id="motionFill" style="width:0%"></div></div>
                        <span id="motionVal">0%</span>
                    </div>
                </div>
                <div class="distraction-panel">
                    <div class="distraction-total-box">
                        <div class="big" id="totalDistraction">0:00</div>
                        <div class="lbl">총 딴짓 시간</div>
                    </div>
                    <div class="dist-bar-row">
                        <div class="dist-bar-label">📱 핸드폰</div>
                        <div class="dist-bar-track"><div class="dist-bar-fill" id="bar-phone" style="width:0%;background:#e91e63"></div></div>
                        <div class="dist-bar-val" id="val-phone">0:00</div>
                    </div>
                    <div class="dist-bar-row">
                        <div class="dist-bar-label">😶 멍때림</div>
                        <div class="dist-bar-track"><div class="dist-bar-fill" id="bar-spacing" style="width:0%;background:#ff9800"></div></div>
                        <div class="dist-bar-val" id="val-spacing">0:00</div>
                    </div>
                    <div class="dist-bar-row">
                        <div class="dist-bar-label">🚶 자리비움</div>
                        <div class="dist-bar-track"><div class="dist-bar-fill" id="bar-away" style="width:0%;background:#2196f3"></div></div>
                        <div class="dist-bar-val" id="val-away">0:00</div>
                    </div>
                    <div class="dist-bar-row">
                        <div class="dist-bar-label">😴 졸음/기타</div>
                        <div class="dist-bar-track"><div class="dist-bar-fill" id="bar-drowsy" style="width:0%;background:#9c27b0"></div></div>
                        <div class="dist-bar-val" id="val-drowsy">0:00</div>
                    </div>
                    <div class="tag-buttons">
                        <button class="tag-btn" data-tag="phone" onclick="tagDistraction('phone')"><span class="icon">📱</span>핸드폰</button>
                        <button class="tag-btn" data-tag="spacing" onclick="tagDistraction('spacing')"><span class="icon">😶</span>멍때림</button>
                        <button class="tag-btn" data-tag="away" onclick="tagDistraction('away')"><span class="icon">🚶</span>자리 비움</button>
                        <button class="tag-btn" data-tag="drowsy" onclick="tagDistraction('drowsy')"><span class="icon">😴</span>졸음/기타</button>
                    </div>
                </div>
            </div>
            <div class="monitor-log" id="monitorLog"></div>
        </div>
    </div>
</div>

<script>
let subjects = [];
let selected = null;
let timerInterval = null;
let running = false;
let elapsed = 0;
let pauseCount = 0;
let pauseSec = 0;
let pauseStart = null;
let startTime = null;
let dragSrc = null;
let studentId = localStorage.getItem('student_id') || '';

// ── 학생 CRUD ──
async function loadStudents() {
    const res = await fetch('/api/students');
    const list = await res.json();
    const sel = document.getElementById('studentSelect');
    sel.innerHTML = '<option value="">-- 선택 --</option>' +
        list.map(s => `<option value="${s.id}" ${s.id===studentId?'selected':''}>${s.name}</option>`).join('');
    document.getElementById('stuCount').textContent = `(${list.length}명)`;
    if (studentId && !list.find(s=>s.id===studentId)) {
        studentId = ''; localStorage.removeItem('student_id');
    }
}
function switchStudent() {
    studentId = document.getElementById('studentSelect').value;
    if (studentId) localStorage.setItem('student_id', studentId);
    else localStorage.removeItem('student_id');
    loadSessions();
}
async function addStudent() {
    const name = prompt('학생 이름을 입력하세요:');
    if (!name) return;
    const res = await fetch('/api/students/add', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name})
    });
    const d = await res.json();
    if (d.error) { alert(d.error); return; }
    studentId = d.id;
    localStorage.setItem('student_id', studentId);
    await loadStudents();
    loadSessions();
}
async function editStudent() {
    if (!studentId) { alert('학생을 먼저 선택해주세요'); return; }
    const name = prompt('새 이름을 입력하세요:');
    if (!name) return;
    const res = await fetch('/api/students/edit', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id:studentId, name})
    });
    const d = await res.json();
    if (d.error) { alert(d.error); return; }
    await loadStudents();
}
async function deleteStudent() {
    if (!studentId) { alert('학생을 먼저 선택해주세요'); return; }
    if (!confirm('이 학생의 모든 데이터가 삭제됩니다. 계속하시겠습니까?')) return;
    await fetch('/api/students/delete', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id:studentId})
    });
    studentId = ''; localStorage.removeItem('student_id');
    await loadStudents();
    loadSessions();
}

// ── 시계 ──
function tickClock() {
    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('curDate').textContent =
        `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
    document.getElementById('curTime').textContent =
        now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const mid = new Date(now); mid.setHours(24,0,0,0);
    const rm = Math.floor((mid-now)/60000);
    document.getElementById('curRemain').textContent =
        `오늘 남은 시간: ${Math.floor(rm/60)}시간 ${rm%60}분`;
}
tickClock(); setInterval(tickClock, 1000);

// ── 누적 시간 계산 ──
function calcTimes() {
    const now = new Date();
    let cursor = now.getTime();
    return subjects.map(s => {
        const skipped = s.done === 2;
        const st = new Date(cursor);
        if (!skipped) cursor += s.goal_minutes * 60000;
        const en = new Date(cursor);
        const mid = new Date(now); mid.setHours(24,0,0,0);
        return {
            start: skipped ? '-' : hm(st),
            end: skipped ? '-' : hm(en),
            overMidnight: !skipped && cursor > mid.getTime(),
            skipped
        };
    });
}
function hm(d) { return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function fmt(sec) {
    return [Math.floor(sec/3600), Math.floor((sec%3600)/60), sec%60]
        .map(v=>String(v).padStart(2,'0')).join(':');
}

// ── 과목 로드 ──
async function load() {
    const res = await fetch('/api/subjects');
    subjects = await res.json();
    render();
}

function getColor(name) { return subjects.find(x=>x.name===name)?.color || '#888'; }

// ── 렌더 ──
function render() {
    const ul = document.getElementById('planList');
    ul.innerHTML = '';
    const times = calcTimes();
    const total = subjects.reduce((a,s) => a+s.goal_minutes, 0);

    document.getElementById('planInfo').textContent =
        subjects.length > 0 ? `${subjects.length}과목` : '';
    document.getElementById('deselBtn').style.display = selected ? 'inline-block' : 'none';

    subjects.forEach((s, i) => {
        const li = document.createElement('li');
        const doneClass = s.done === 1 ? ' done' : (s.done === 2 ? ' skipped' : '');
        li.className = 'plan-item' + (selected === s.name ? ' selected' : '') + doneClass;
        li.draggable = true;
        li.dataset.idx = i;
        li.addEventListener('dragstart', onDS);
        li.addEventListener('dragover', onDO);
        li.addEventListener('dragleave', onDL);
        li.addEventListener('drop', onDD);
        li.addEventListener('dragend', onDE);

        const t = times[i];
        const isDone = s.done === 1 || s.done === 2;
        const labelHtml = s.done === 1
            ? '<span class="plan-done-label completed">완료</span>'
            : (s.done === 2 ? '<span class="plan-done-label skipped">건너뛰기</span>' : '');
        li.innerHTML = `
            <button class="plan-done-btn" onclick="event.stopPropagation();toggleDone('${s.name}')" title="${isDone ? '취소' : '완료/건너뛰기'}">${isDone ? '✓' : ''}</button>
            <span class="drag-handle" title="순서 변경">&#9776;</span>
            <span class="plan-num">${i+1}</span>
            <span class="plan-dot" style="background:${s.color}"></span>
            <span class="plan-name">${s.name}</span>
            ${labelHtml}
            <span class="plan-minutes">${s.goal_minutes}분</span>
            <span class="plan-time-range">${t.skipped ? '' : t.start+'~'}<span class="end">${t.skipped ? '' : (t.overMidnight ? '초과' : t.end)}</span></span>
        `;
        li.onclick = (e) => { e.stopPropagation(); selectSub(s.name); };
        ul.appendChild(li);
    });

    if (subjects.length > 0) {
        const activeTotal = subjects.reduce((a,s) => a + (s.done === 2 ? 0 : s.goal_minutes), 0);
        const lastActive = [...times].reverse().find(t => !t.skipped) || times[times.length-1];
        const h = Math.floor(activeTotal/60), m = activeTotal%60;
        document.getElementById('planTotal').innerHTML =
            `총 <strong>${h}시간${m>0?' '+m+'분':''}</strong> · 종료 <strong>${lastActive.overMidnight?'자정 초과':lastActive.end}</strong>`;
    } else {
        document.getElementById('planTotal').innerHTML = '';
    }

    updateTimer();
}

// ── 선택 ──
function selectSub(name) {
    if (running) return;
    selected = (selected === name) ? null : name;
    render();
}

function updateTimer() {
    if (selected) {
        const s = subjects.find(x=>x.name===selected);
        const idx = subjects.indexOf(s);
        const t = calcTimes()[idx];
        document.getElementById('selSubject').textContent = selected;
        document.getElementById('selSubject').style.color = s.color;
        const goalH = Math.floor(s.goal_minutes/60);
        const goalM = s.goal_minutes%60;
        const goalStr = goalH > 0 ? `${goalH}시간${goalM>0?' '+goalM+'분':''}` : `${goalM}분`;
        document.getElementById('timerSchedule').textContent =
            `목표: ${goalStr} | 예상 종료: ~${t.overMidnight?'자정초과':t.end}`;
        document.getElementById('timerSub').textContent = '시작 버튼을 눌러주세요';
        document.getElementById('startBtn').disabled = false;
    } else {
        document.getElementById('selSubject').textContent = '과목을 선택하세요';
        document.getElementById('selSubject').style.color = '#555';
        document.getElementById('timerSchedule').textContent = '';
        document.getElementById('timerSub').textContent = '';
        document.getElementById('startBtn').disabled = true;
    }
}

function deselect() {
    if (running) return;
    selected = null;
    render();
    updateTimer();
}

// ── 드래그 ──
function onDS(e) { dragSrc=+e.currentTarget.dataset.idx; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function onDO(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDL(e) { e.currentTarget.classList.remove('drag-over'); }
function onDD(e) {
    e.preventDefault(); e.currentTarget.classList.remove('drag-over');
    const to=+e.currentTarget.dataset.idx;
    if(dragSrc===null||dragSrc===to) return;
    const item=subjects.splice(dragSrc,1)[0];
    subjects.splice(to,0,item);
    render();
    fetch('/api/subjects/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order:subjects.map(s=>s.name)})});
}
function onDE(e) { e.currentTarget.classList.remove('dragging'); dragSrc=null; document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over')); }

// ── 타이머 ──
function tick() {
    elapsed++;
    document.getElementById('timerDisplay').textContent = fmt(elapsed);
    const s = subjects.find(x=>x.name===selected);
    if (s) {
        const gs = s.goal_minutes*60;
        const pct = Math.min((elapsed/gs)*100, 100);
        const bar = document.getElementById('progressBar');
        bar.style.width = pct+'%';
        if (elapsed >= gs) {
            bar.classList.add('over'); bar.style.width='100%';
            document.getElementById('timerSub').textContent = `목표 달성! +${fmt(elapsed-gs)} 초과 진행 중`;
        } else {
            bar.classList.remove('over');
            document.getElementById('timerSub').textContent = `남은: ${fmt(gs-elapsed)}`;
        }
    }
}

function startTimer() {
    if (running || !selected) return;
    if (!studentId) { alert('학생을 먼저 선택해주세요'); return; }
    running = true;
    if (!startTime) {
        startTime = new Date().toISOString();
        showMonitor();
    }
    document.getElementById('startBtn').disabled = true;
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('commentBox').style.display = 'none';
    if (pauseStart) { pauseSec += Math.floor((Date.now()-pauseStart)/1000); pauseStart=null; }
    timerInterval = setInterval(function(){ tick(); tickDistraction(); }, 1000);
}

function pauseTimer() {
    if (!running) return;
    clearInterval(timerInterval); timerInterval=null;
    running = false;
    pauseCount++;
    pauseStart = Date.now();
    document.getElementById('startBtn').disabled = false;
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('timerSub').textContent = `일시정지 중 (${pauseCount}회)`;
}

async function stopTimer() {
    clearInterval(timerInterval); timerInterval=null;
    running = false;
    if (pauseStart) { pauseSec += Math.floor((Date.now()-pauseStart)/1000); pauseStart=null; }
    const endTime = new Date().toISOString();

    const totalDist = cvDistractions.phone+cvDistractions.spacing+cvDistractions.away+cvDistractions.drowsy;
    if (elapsed > 0 && selected) {
        const res = await fetch('/api/sessions/save', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                student_id:studentId, subject:selected, start_time:startTime, end_time:endTime,
                duration_seconds:elapsed, pause_count:pauseCount, pause_seconds:pauseSec,
                distractions:cvDistractions, distraction_seconds:totalDist
            })
        });
        const d = await res.json();
        if (d.comment) {
            document.getElementById('commentText').textContent = d.comment;
            document.getElementById('commentBox').style.display = 'block';
        }
        loadSessions();
    }

    hideMonitor();
    elapsed=0; pauseCount=0; pauseSec=0; startTime=null;
    document.getElementById('timerDisplay').textContent = '00:00:00';
    document.getElementById('startBtn').disabled = !selected;
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('timerSub').textContent = selected ? '시작 버튼을 눌러주세요' : '';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('progressBar').classList.remove('over');
}

// ── 오늘 기록 ──
async function loadSessions() {
    const res = await fetch('/api/sessions/today?student_id='+studentId);
    const sessions = await res.json();
    const tbody = document.getElementById('todayBody');
    if (!sessions.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">아직 기록이 없어요</td></tr>';
        document.getElementById('todaySummary').innerHTML = '';
        return;
    }
    tbody.innerHTML = sessions.map(s => {
        const st = s.start_time ? new Date(s.start_time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '-';
        const et = s.end_time ? new Date(s.end_time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '-';
        return `<tr>
            <td><span class="subj-dot" style="background:${getColor(s.subject)}"></span>${s.subject}</td>
            <td>${fmt(s.duration_seconds)}</td><td>${st}</td><td>${et}</td><td>${s.pause_count}회</td>
        </tr>`;
    }).join('');
    const tot = sessions.reduce((a,s)=>a+s.duration_seconds,0);
    document.getElementById('todaySummary').innerHTML = `
        <div class="stat"><div class="val">${sessions.length}</div><div class="lbl">세션</div></div>
        <div class="stat"><div class="val">${Math.floor(tot/3600)}h ${Math.floor((tot%3600)/60)}m</div><div class="lbl">총 공부</div></div>
        <div class="stat"><div class="val">${sessions.reduce((a,s)=>a+s.pause_count,0)}</div><div class="lbl">일시정지</div></div>
    `;
}

// ── 외부 클릭 시 선택 해제 ──
document.addEventListener('click', function(e) {
    if (running || !selected) return;
    const card = e.target.closest('.card');
    const leftCard = document.getElementById('planList').closest('.card');
    if (card === leftCard) return;
    if (e.target.closest('.timer-buttons')) return;
    selected = null;
    render();
});

// ── 모니터링 ──
let cvVideo, cvCanvas, cvCtx;
let prevFrame = null, refFrame = null, cvFrameCount = 0;
let motionLevel = 0, noMotionCount = 0, noPresenceCount = 0;
let cvDistractions = { phone: 0, spacing: 0, away: 0, drowsy: 0 };
let currentTag = null;
let cvLogs = [];
let cvAnimId = null;
const MOTION_TH = 15, PRESENCE_TH = 5, NO_MOTION_LIM = 100, NO_PRESENCE_LIM = 50;

function showMonitor() {
    document.getElementById('todayLogCard').style.display = 'none';
    const mp = document.getElementById('monitorPanel');
    mp.style.display = 'block';
    mp.classList.add('active');
    initWebcam();
}
function hideMonitor() {
    document.getElementById('todayLogCard').style.display = '';
    const mp = document.getElementById('monitorPanel');
    mp.style.display = 'none';
    mp.classList.remove('active');
    stopWebcam();
}
function fmtShort(sec) { const m=Math.floor(sec/60),s=sec%60; return m+':'+String(s).padStart(2,'0'); }

async function initWebcam() {
    cvVideo = document.getElementById('webcamVideo');
    cvCanvas = document.getElementById('overlayCanvas');
    cvCtx = cvCanvas.getContext('2d', { willReadFrequently: true });
    prevFrame = null; refFrame = null; cvFrameCount = 0;
    noMotionCount = 0; noPresenceCount = 0;
    cvDistractions = { phone:0, spacing:0, away:0, drowsy:0 };
    currentTag = null; cvLogs = [];
    document.querySelectorAll('.tag-btn').forEach(b=>b.classList.remove('active'));
    updateDistChart();
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video:{width:640,height:480,facingMode:'user'} });
        cvVideo.srcObject = stream;
        cvVideo.addEventListener('loadeddata', function onLoad() {
            cvCanvas.width = cvVideo.videoWidth;
            cvCanvas.height = cvVideo.videoHeight;
            addCvLog('웹캠 연결 완료');
            cvAnimId = requestAnimationFrame(processFrame);
            cvVideo.removeEventListener('loadeddata', onLoad);
        });
    } catch(e) {
        addCvLog('웹캠 연결 실패: '+e.message);
        document.getElementById('webcamBadge').textContent = '웹캠 없음';
        document.getElementById('webcamBadge').className = 'webcam-badge away';
    }
}
function stopWebcam() {
    if (cvAnimId) { cancelAnimationFrame(cvAnimId); cvAnimId = null; }
    if (cvVideo && cvVideo.srcObject) {
        cvVideo.srcObject.getTracks().forEach(t=>t.stop());
        cvVideo.srcObject = null;
    }
    prevFrame = null; refFrame = null;
}

function processFrame() {
    if (!cvVideo || cvVideo.paused || cvVideo.ended) { cvAnimId=requestAnimationFrame(processFrame); return; }
    const w=cvCanvas.width, h=cvCanvas.height;
    cvCtx.drawImage(cvVideo,0,0,w,h);
    const frame = cvCtx.getImageData(0,0,w,h);
    cvFrameCount++;
    if (cvFrameCount===30) { refFrame=new Uint8Array(frame.data); addCvLog('기준 프레임 저장'); }

    if (prevFrame && cvFrameCount>10) {
        let diff=0, presDiff=0;
        const d=frame.data, step=8, total=(d.length/4)/step;
        for (let i=0;i<d.length;i+=step*4) {
            const avg=(Math.abs(d[i]-prevFrame[i])+Math.abs(d[i+1]-prevFrame[i+1])+Math.abs(d[i+2]-prevFrame[i+2]))/3;
            if(avg>MOTION_TH) diff++;
        }
        if (refFrame) {
            for (let i=0;i<d.length;i+=step*4) {
                const avg=(Math.abs(d[i]-refFrame[i])+Math.abs(d[i+1]-refFrame[i+1])+Math.abs(d[i+2]-refFrame[i+2]))/3;
                if(avg>25) presDiff++;
            }
        }
        motionLevel = (diff/total)*100;
        const presLevel = refFrame ? (presDiff/total)*100 : 50;
        document.getElementById('motionFill').style.width = Math.min(motionLevel*5,100)+'%';
        document.getElementById('motionVal').textContent = motionLevel.toFixed(1)+'%';

        const badge = document.getElementById('webcamBadge');
        if (presLevel < PRESENCE_TH && refFrame) {
            noPresenceCount++;
            if (noPresenceCount>NO_PRESENCE_LIM && !currentTag) {
                tagDistraction('away');
                badge.textContent='자리 비움 감지'; badge.className='webcam-badge away';
            }
        } else {
            if (currentTag==='away' && noPresenceCount>NO_PRESENCE_LIM) tagDistraction('away');
            noPresenceCount=0;
            if (motionLevel<0.3) {
                noMotionCount++;
                if (noMotionCount>NO_MOTION_LIM && !currentTag) {
                    tagDistraction('spacing');
                    badge.textContent='멍때림 감지'; badge.className='webcam-badge warn';
                }
            } else {
                if (currentTag==='spacing' && noMotionCount>NO_MOTION_LIM) tagDistraction('spacing');
                noMotionCount=0;
                if (!currentTag) { badge.textContent='집중 중'; badge.className='webcam-badge ok'; }
            }
        }
        drawOverlay(w,h);
    }
    prevFrame = new Uint8Array(frame.data);
    cvAnimId = requestAnimationFrame(processFrame);
}

function drawOverlay(w,h) {
    cvCtx.clearRect(0,0,w,h);
    cvCtx.strokeStyle = currentTag ? 'rgba(244,67,54,0.6)' : 'rgba(76,175,80,0.4)';
    cvCtx.lineWidth = 2;
    cvCtx.setLineDash([8,4]);
    const cx=w/2, headY=h*0.22, headR=h*0.12;
    cvCtx.beginPath();
    cvCtx.ellipse(cx,headY,headR*0.85,headR,0,0,Math.PI*2);
    cvCtx.stroke();
    cvCtx.beginPath();
    cvCtx.moveTo(cx-w*0.25,h*0.55);
    cvCtx.quadraticCurveTo(cx-w*0.15,h*0.32,cx,h*0.35);
    cvCtx.quadraticCurveTo(cx+w*0.15,h*0.32,cx+w*0.25,h*0.55);
    cvCtx.stroke();
    cvCtx.setLineDash([]);
    if (currentTag) { cvCtx.fillStyle='rgba(244,67,54,0.12)'; cvCtx.fillRect(0,0,w,h); }
}

function tagDistraction(tag) {
    const btns = document.querySelectorAll('.tag-btn');
    if (currentTag===tag) {
        currentTag=null;
        btns.forEach(b=>b.classList.remove('active'));
        const badge=document.getElementById('webcamBadge');
        badge.textContent='집중 중'; badge.className='webcam-badge ok';
        addCvLog(getTagName(tag)+' 종료');
        return;
    }
    if (currentTag) {
        btns.forEach(b=>b.classList.remove('active'));
        addCvLog(getTagName(currentTag)+' 종료');
    }
    currentTag=tag;
    btns.forEach(b=>b.classList.toggle('active',b.dataset.tag===tag));
    addCvLog(getTagName(tag)+' 시작');
}
function getTagName(t) { return {phone:'📱 핸드폰',spacing:'😶 멍때림',away:'🚶 자리비움',drowsy:'😴 졸음/기타'}[t]||t; }

function tickDistraction() {
    if (currentTag && running) {
        cvDistractions[currentTag]++;
        updateDistChart();
    }
}
function updateDistChart() {
    const tot = cvDistractions.phone+cvDistractions.spacing+cvDistractions.away+cvDistractions.drowsy;
    document.getElementById('totalDistraction').textContent = fmtShort(tot);
    const mx = Math.max(tot,60);
    ['phone','spacing','away','drowsy'].forEach(k=>{
        const pct = tot>0?(cvDistractions[k]/mx)*100:0;
        document.getElementById('bar-'+k).style.width = Math.max(pct,0)+'%';
        document.getElementById('val-'+k).textContent = fmtShort(cvDistractions[k]);
    });
}

function addCvLog(msg) {
    const now=new Date();
    const t=now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    cvLogs.unshift({time:t,msg});
    const el=document.getElementById('monitorLog');
    el.innerHTML=cvLogs.slice(0,15).map(l=>`<div class="entry"><span class="t">${l.time}</span>${l.msg}</div>`).join('');
}

// ── 완료 토글 ──
async function toggleDone(name) {
    const res = await fetch('/api/subjects/toggle_done', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name, student_id: studentId})
    });
    const d = await res.json();
    const s = subjects.find(x=>x.name===name);
    if (s) s.done = d.done;
    render();
}

function autoCompletePastSubjects() {
    const now = new Date();
    const times = calcTimes();
    let changed = false;
    subjects.forEach((s, i) => {
        if (s.done !== 0) return;
        const endParts = times[i].end.split(':');
        const endDate = new Date(now);
        endDate.setHours(+endParts[0], +endParts[1], 0, 0);
        if (!times[i].overMidnight && now >= endDate) {
            changed = true;
            fetch('/api/subjects/toggle_done', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({name: s.name, student_id: studentId})
            }).then(r => r.json()).then(d => {
                s.done = d.done;
                render();
            });
        }
    });
}
setInterval(autoCompletePastSubjects, 30000);

// ── 초기화 ──
loadStudents().then(() => { load().then(() => { autoCompletePastSubjects(); }); loadSessions(); });
