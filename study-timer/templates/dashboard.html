<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 공부 매니저 - 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>

<nav>
    <div class="logo">AI 공부 매니저</div>
    <div>
        <a href="/">타이머</a>
        <a href="/dashboard" class="active">대시보드</a>
        <a href="/db">DB</a>
    </div>
</nav>

<div class="student-bar" style="background:#16213e;border-bottom:1px solid #1a1a40;padding:8px 24px;display:flex;align-items:center;gap:12px;font-size:.85rem">
    <label style="color:#94a3b8;white-space:nowrap">학생:</label>
    <select id="studentSelect" onchange="switchDashStudent()" style="background:#0f0f23;color:#e0e0e0;border:1px solid #1a1a40;border-radius:6px;padding:4px 8px;font-size:.85rem">
        <option value="">-- 선택 --</option>
    </select>
    <span id="stuCount" style="color:#64748b;font-size:.75rem"></span>
</div>

<div class="main">
    <div class="ov-row" id="ovRow"></div>

    <div class="section">
        <div class="section-title">나 vs 반 평균 비교</div>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">
            <div class="subj-tabs" id="subjTabs" style="margin-bottom:0"></div>
            <div class="period-tabs" id="periodTabs" style="margin-bottom:0"></div>
        </div>

        <div class="card">
            <div class="legend-row">
                <div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>나</div>
                <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>반 평균</div>
            </div>
            <div class="chart-area"><canvas id="compareChart"></canvas></div>
        </div>

        <div class="compare-grid">
            <div class="card">
                <div style="font-size:.8rem;color:#94a3b8;margin-bottom:10px">과목별 나 vs 반 평균 (분)</div>
                <div class="compare-chart"><canvas id="subjBar"></canvas></div>
            </div>
            <div class="card">
                <div style="font-size:.8rem;color:#94a3b8;margin-bottom:10px">과목 균형 비교</div>
                <div class="compare-chart"><canvas id="radarCompare"></canvas></div>
            </div>
        </div>

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <div style="font-size:.85rem;color:#94a3b8;font-weight:600">반 20명 중 나의 위치</div>
                <div style="display:flex;gap:10px;font-size:.6rem;color:#64748b">
                    <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-right:3px"></span>상위</span>
                    <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#3b82f6;margin-right:3px"></span>중상</span>
                    <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-right:3px"></span>중하</span>
                    <span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#ef4444;margin-right:3px"></span>하위</span>
                    <span><span style="display:inline-block;width:8px;height:2px;background:#fbbf24;margin-right:3px;vertical-align:middle"></span>평균</span>
                </div>
            </div>
            <div id="rankBars" style="padding-top:6px"></div>
        </div>
    </div>

    <div class="section">
        <div class="section-title" style="display:flex;justify-content:space-between;align-items:center">
            <span>과목별 일별 누적</span>
            <div class="period-tabs" id="stackPeriodTabs" style="margin-bottom:0"></div>
        </div>
        <div class="card">
            <div class="legend-row" id="stackLegend"></div>
            <div class="chart-area" style="height:300px"><canvas id="stackedChart"></canvas></div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">시간 분석</div>
        <div class="card" id="gapSection"></div>
    </div>

    <div class="section">
        <div class="section-title">AI 학습 보고서</div>
        <div class="report" id="reportSection"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
